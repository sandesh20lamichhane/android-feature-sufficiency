# Week 2 gate. Same models, re-measured where a scanner actually operates.
# No new data required. Decision point: if the gap stays closed here AND under
# evasion cost, you are making a much stronger claim than planned.
data: synthetic
models: [linear_svm, lightgbm]
feature_sets: [P, M, S]
baseline_arm: "P::linear_svm"
seed: 0
n_boot: 2000
split: {protocol: random, test_size: 0.3, seed: 0}
report_fprs: [0.1, 0.01, 0.001, 0.0001]
evasion: {enabled: false}
