[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afs"
version = "0.1.0"
description = "Feature-set sufficiency in Android malware detection: accuracy, low-FPR behaviour, and evasion cost"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "S. Lamichhane" }]

dependencies = [
  "numpy>=1.26,<2.1",
  "pandas>=2.1,<2.3",
  "scipy>=1.11,<1.15",
  "scikit-learn==1.4.2",
  "lightgbm==4.3.0",
  "pyarrow>=15.0,<17.0",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "tqdm>=4.66",
  "matplotlib>=3.8,<3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "nbstripout>=0.7"]

[project.scripts]
afs-run = "afs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
